name: Publish

# Stages a release on npm when a release tag is pushed. Authenticates with npm
# trusted publishing (OIDC), so there is no npm token to steal, and every
# release carries a provenance attestation linking it to this workflow run.
# The trusted publisher is stage-only: a maintainer approves the staged
# version with 2FA (`npm stage approve <id>`) before anyone can install it.
#
# Only the final job can mint the OIDC token, and it runs no project or
# dependency code: it stages a tarball built and tested in earlier jobs.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Check tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main"
            exit 1
          fi

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  pack:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache here: a release should not restore state written
      # by other workflow runs.
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      id-token: write

    steps:
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Check npm supports staging
        run: |
          npm_version="$(npm --version)"
          if ! printf '%s\n' 11.15.0 "${npm_version}" | sort -V -C; then
            echo "::error::npm ${npm_version} is too old for npm stage (needs 11.15.0 or later)"
            exit 1
          fi

      - name: Stage for approval
        run: npm stage publish ./*.tgz --ignore-scripts
