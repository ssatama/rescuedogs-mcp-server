name: API contract

# Verifies the client against the live rescuedogs API. Kept out of the main CI
# workflow so a transient API outage cannot block an unrelated pull request.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Contract tests
        run: npm run test:contract
